[project]
name = "candor-blocks"
version = "0.1.0"
description = "Honest, checkable fine print for datasets: each caveat says what to do about it and whether the data already takes care of it"
readme = "README.md"
authors = [
    { name = "Chris Mihiar", email = "cmihiar@ctrees.org" }
]
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "src/candor_blocks/candid-core-fields.LICENSE"]
keywords = ["candid", "candid-core", "data-candor", "caveats", "metadata"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
candor-blocks = "candor_blocks.cli:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
